<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Report Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Safety Report Manager</h1>

        <p>Add and manage safety reports</p>

        <div class="input-section">

            <input
                type="text"
                id="reportInput"
                placeholder="Enter safety report"
            >

            <button id="addButton">Add Report</button>

        </div>

        <h2>Report History</h2>
        <button id="clearButton">Clear All</button>

        <ul id="reportList"></ul>

        <h3 id="totalCount">Total Reports: 0</h3>

    </div>

    <script src="script.js"></script>

</body>

</html>
